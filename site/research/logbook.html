<main id="main" class="lab">
  <div class="lab-toolbar">
    <a class="lab-back" href="<!-- back url -->">← <!-- back label --></a>
    <h1><!-- project title --></h1>
    <a class="lab-source" href="<!-- source url -->">GitHub ↗</a>
    <button type="button" class="lab-nav-toggle" aria-controls="lab-goals" aria-expanded="false">Browse goals</button>
  </div>

  <div class="lab-layout">
    <nav id="lab-goals" class="lab-goals" aria-label="Research goals">
      <h2>Goals and scripts</h2>
      <!-- goal navigation -->
      <p class="lab-date-note">Dates refer to saved research versions or the thesis. The scripts are runnable adaptations using generated data.</p>
    </nav>

    <div class="lab-content">
      <!-- experiments -->
    </div>
  </div>
  <dialog id="file-preview" aria-labelledby="preview-title">
    <div class="preview-head"><h2 id="preview-title"></h2><form method="dialog"><button type="submit">Close</button></form></div>
    <div id="preview-content"></div>
    <div class="preview-links"><a id="preview-open" target="_blank" rel="noopener">Open file ↗</a><a id="preview-download" download>Download</a></div>
  </dialog>
</main>
