<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research logbook — Samuel Llanwarne</title><meta name="description" content="Start a blank research logbook, record results and download a shareable copy.">
<link rel="stylesheet" href="../../style.css?v=2c230f6c43"><link rel="stylesheet" href="../logbook.css?v=bf60cf2d63"><link rel="stylesheet" href="starter.css?v=f7cef2ec15"></head><body><a class="skip" href="#main">Skip to content</a>
<main class="lab draft" id="main">
  <div class="lab-toolbar">
    <a class="lab-back" href="../">← PhD logbook</a>
    <h1>Research logbook</h1>
    <button type="button" id="draft-preview" aria-pressed="false">Preview</button>
  </div>
  <div class="lab-layout">
    <aside class="lab-goals" aria-label="Research goals">
      <label for="draft-title">Project name</label>
      <input id="draft-title" placeholder="Name your project" maxlength="160">
      <h2 class="draft-goal-heading">Pages</h2>
      <nav aria-label="Logbook pages">
        <ul id="draft-goals"></ul>
        <div id="draft-root-drop" hidden>Drop here to move to the top level</div>
        <details class="draft-add">
          <summary class="lab-add-page">+ Add page</summary>
          <button type="button" data-add-page="entry"><strong>Entry</strong><span>Question, method and result</span></button>
          <button type="button" data-add-page="section"><strong>Section</strong><span>Notes and child pages</span></button>
        </details>
      </nav>
    </aside>
    <div class="lab-content">
      <div class="lab-experiment draft-entry">
        <section id="draft-editor" aria-labelledby="draft-entry-heading">
          <div class="draft-intro">
            <h2 id="draft-entry-heading">Research entry</h2>
          </div>
          <form id="draft-form">
            <label for="draft-entry-title">Title</label>
            <input id="draft-entry-title" name="title" placeholder="Give this step a short name">
            <div id="draft-section-fields" hidden>
              <label for="draft-body">Notes <span>(Markdown)</span></label>
              <textarea id="draft-body" name="body" rows="9" placeholder="What connects the pages in this section?"></textarea>
            </div>
            <div id="draft-entry-fields">
            <label for="draft-question">Question</label>
            <textarea id="draft-question" name="question" rows="2" placeholder="What am I trying to find out?"></textarea>
            <label for="draft-method">What I did</label>
            <textarea id="draft-method" name="method" rows="3" placeholder="What did I start with, and what did I try?"></textarea>
            <label for="draft-result">Result and next step</label>
            <textarea id="draft-result" name="result" rows="3" placeholder="What happened? What will I try or decide next?"></textarea>
            <label for="draft-evidence">Evidence <span>(optional)</span></label>
            <input id="draft-evidence" name="evidence" placeholder="Link, file name or reference">
            </div>
            <div id="draft-move-row" hidden tabindex="-1">
              <label for="draft-move">Move to</label>
              <select id="draft-move"></select>
              <div class="draft-actions">
                <button type="button" id="draft-up">Move up</button>
                <button type="button" id="draft-down">Move down</button>
              </div>
            </div>
            <button type="button" id="draft-delete">Delete page</button>
          </form>
        </section>
        <section id="draft-preview-pane" aria-label="Page preview" hidden>
          <div id="draft-reading"></div>
          <button type="button" class="draft-edit-section lab-icon-button" aria-label="Edit section" title="Edit section"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m13.5 6.5 4 4M4 20l4.5-1 11-11a2.8 2.8 0 0 0-4-4l-11 11L4 20Z"/></svg></button>
        </section>
        <div class="draft-files">
          <p id="draft-status" role="status"></p>
          <div class="draft-actions">
            <button type="button" id="draft-new">New logbook</button>
            <button type="button" id="draft-open">Open draft</button>
            <button type="button" id="draft-save">Save draft</button>
            <button type="button" id="draft-export">Download readable copy</button>
            <input hidden id="draft-file" type="file" accept=".json,application/json">
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="starter.js?v=1406810d90" defer></script></body></html>
